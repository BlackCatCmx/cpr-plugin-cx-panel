[package]
name = "cpr-plugin-cx-panel"
version = "0.5.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "80f7d53085f5c9552e7e74b796a0bec50586ee1b", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt"] }

[profile.release]
strip = "symbols"
panic = "abort"
