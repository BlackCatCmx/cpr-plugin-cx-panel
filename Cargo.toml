[package]
name = "cpr-plugin-cx-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
base64 = "0.22.1"
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "589e1bc999a8b110201b7fdcbf32d2e75bf08253", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }

[profile.release]
strip = "symbols"
panic = "abort"
