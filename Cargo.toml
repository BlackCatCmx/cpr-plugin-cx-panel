[package]
name = "cpr-plugin-cx-panel"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
base64 = "0.22.1"
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "16d8a3f87309d9346a5f204673390fe20478b40e", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }

[profile.release]
strip = "symbols"
panic = "abort"
